apiVersion: apps/v1
kind: Deployment

metadata:
  name: db

spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db

  template:
    metadata:
      labels:
        app: db

    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
          
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: blog-config
                  key: DB_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blog-secrets
                  key: DB_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: blog-config
                  key: DB_NAME

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - user
                - -d
                - blog

            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-data
