apiVersion: v1
kind: ConfigMap
metadata:
  name: blog-config
data:
  HTTP_PORT: "8080"
  DB_HOST: "db"
  DB_PORT: "5432"
  DB_USER: "user"
  DB_NAME: "blog"
  DB_SSLMODE: "disable"

  DB_MAX_OPEN_CONNS: "10"
  DB_MAX_IDLE_CONNS: "5"
  DB_CONN_MAX_LIFETIME: "30m"

  HTTP_READ_HEADER_TIMEOUT: "5s"
  HTTP_READ_TIMEOUT: "15s"
  HTTP_WRITE_TIMEOUT: "30s"
  HTTP_IDLE_TIMEOUT: "60s"
  HTTP_SHUTDOWN_TIMEOUT: "10s"
  HTTP_DRAIN_DELAY: "2s"
