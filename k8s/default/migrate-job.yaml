apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: db-migrate
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-db
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h db -p 5432 -U user -d blog; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
        - name: migrate
          image: blog-backend:dev
          imagePullPolicy: Never

          command:
            - ./migrate

          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: blog-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: blog-config
                  key: DB_PORT

            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: blog-config
                  key: DB_USER

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: blog-config
                  key: DB_NAME

            - name: DB_SSLMODE
              valueFrom:
                configMapKeyRef:
                  name: blog-config
                  key: DB_SSLMODE

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blog-secrets
                  key: DB_PASSWORD

            - name: MIGRATIONS_URL
              value: "file:///app/migrations"



