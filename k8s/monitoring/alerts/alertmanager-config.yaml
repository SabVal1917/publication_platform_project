global:
  resolve_timeout: 5m
route:
  receiver: local-webhook
  group_by:
    - alertname
    - namespace
    - service
    - severity
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
receivers:
  - name: local-webhook
    webhook_configs:
      - url: http://alert-webhook:8080/alerts
        send_resolved: true
