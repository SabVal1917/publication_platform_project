apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - alertmanager.yaml
  - webhook.yaml
  - vmalert.yaml
configMapGenerator:
  - name: publication-platform-alert-rules
    files:
      - service.yaml=rules/service.yaml
      - runtime.yaml=rules/runtime.yaml
  - name: alertmanager-config
    files:
      - alertmanager.yaml=alertmanager-config.yaml
