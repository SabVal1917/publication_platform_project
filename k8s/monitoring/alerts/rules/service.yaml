groups:
  - name: publication-platform-service
    interval: 15s
    rules:
      - alert: BackendHigh5xxCount
        expr: |
          sum by (namespace) (
            increase(publication_platform_http_requests_total{
              job="kubernetes-pods", namespace="default", app="backend",
              route=~"/api/.*", route!="/api/ping", status=~"5.."
            }[5m])
          ) >= 5
        for: 1m
        labels:
          severity: critical
          service: publication-platform
          component: backend
        annotations:
          summary: "Backend возвращает много ответов 5xx"
          description: "За последние 5 минут зарегистрировано {{ printf \"%.1f\" $value }} ответов 5xx на API. Порог: не менее 5, условие сохраняется 1 минуту."
      - alert: ProberUnavailable
        expr: |
          ((min(up{job="kubernetes-pods", namespace="default", app="sre-prober"}) or vector(0)) == 0)
          or
          ((min(publication_platform_probe_success{job="kubernetes-pods", namespace="default", app="sre-prober"}) or vector(0)) == 0)
          or
          (time() - (max(publication_platform_probe_timestamp_seconds{job="kubernetes-pods", namespace="default", app="sre-prober"}) or vector(0)) > 30)
        for: 1m
        labels:
          severity: critical
          service: publication-platform
          component: prober
          namespace: default
        annotations:
          summary: "Пробер обнаружил недоступность или перестал работать"
          description: "В течение 1 минуты проба API неуспешна, метрики пробера недоступны либо последняя завершённая проба старше 30 секунд. Проверить backend, PostgreSQL и Deployment sre-prober."
      - alert: BackendHighLatency
        expr: |
          (
            histogram_quantile(0.95,
              sum by (namespace, route, le) (
                rate(publication_platform_http_request_duration_seconds_bucket{
                  job="kubernetes-pods", namespace="default", app="backend",
                  route=~"/api/.*", route!="/api/ping", status=~"2..|3.."
                }[5m])
              )
            ) > 0.5
          )
          and on (namespace, route)
          (
            sum by (namespace, route) (
              increase(publication_platform_http_request_duration_seconds_count{
                job="kubernetes-pods", namespace="default", app="backend",
                route=~"/api/.*", route!="/api/ping", status=~"2..|3.."
              }[5m])
            ) >= 20
          )
        for: 2m
        labels:
          severity: warning
          service: publication-platform
          component: backend
        annotations:
          summary: "Высокая задержка API {{ $labels.route }}"
          description: "p95 успешных ответов за 5 минут: {{ printf \"%.3f\" $value }} с. Порог: более 0.5 с в течение 2 минут при не менее 20 ответах за окно."
