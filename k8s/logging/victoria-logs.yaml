apiVersion: v1
kind: Namespace
metadata:
  name: observability

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-logs-data
  namespace: observability
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs
  namespace: observability
  labels:
    app: victoria-logs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: victoria-logs
  template:
    metadata:
      labels:
        app: victoria-logs
    spec:
      containers:
        - name: victoria-logs
          image: victoriametrics/victoria-logs:v1.53.0
          imagePullPolicy: IfNotPresent
          args:
            - "-storageDataPath=/victoria-logs-data"
            - "-retentionPeriod=7d"
            - "-httpListenAddr=:9428"
          ports:
            - name: http
              containerPort: 9428
          volumeMounts:
            - name: data
              mountPath: /victoria-logs-data
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: victoria-logs-data

---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
  namespace: observability
spec:
  selector:
    app: victoria-logs
  ports:
    - name: http
      port: 9428
      targetPort: http
  type: ClusterIP