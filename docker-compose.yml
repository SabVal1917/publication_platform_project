services:
  db:
    image: postgres:15-alpine
    container_name: blog_db
    restart: always
    environment:
      POSTGRES_USER: "${DB_USER:-user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      POSTGRES_DB: "${DB_NAME:-blog}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4
    container_name: blog_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

  migrate:
    build: ./backend
    command: ["./migrate"]
    restart: "no"
    environment:
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_USER: "${DB_USER:-user}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      DB_NAME: "${DB_NAME:-blog}"
      DB_SSLMODE: "${DB_SSLMODE:-disable}"
      MIGRATIONS_URL: "file:///app/migrations"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: blog_backend
    restart: always
    environment:
      HTTP_PORT: "${HTTP_PORT:-8080}"
      HTTP_READ_HEADER_TIMEOUT: "${HTTP_READ_HEADER_TIMEOUT:-5s}"
      HTTP_READ_TIMEOUT: "${HTTP_READ_TIMEOUT:-15s}"
      HTTP_WRITE_TIMEOUT: "${HTTP_WRITE_TIMEOUT:-30s}"
      HTTP_IDLE_TIMEOUT: "${HTTP_IDLE_TIMEOUT:-60s}"
      HTTP_SHUTDOWN_TIMEOUT: "${HTTP_SHUTDOWN_TIMEOUT:-10s}"
      HTTP_DRAIN_DELAY: "${HTTP_DRAIN_DELAY:-2s}"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_USER: "${DB_USER:-user}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      DB_NAME: "${DB_NAME:-blog}"
      DB_SSLMODE: "${DB_SSLMODE:-disable}"
      DB_MAX_OPEN_CONNS: "${DB_MAX_OPEN_CONNS:-10}"
      DB_MAX_IDLE_CONNS: "${DB_MAX_IDLE_CONNS:-5}"
      DB_CONN_MAX_LIFETIME: "${DB_CONN_MAX_LIFETIME:-30m}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${HTTP_PORT}/health/ready >/dev/null 2>&1"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blog_frontend
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./backend/deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
